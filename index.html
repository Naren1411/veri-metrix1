const rawFetch=window.fetch.bind(window);
window.fetch=async function(input,init={}){
  const url=typeof input==="string"?input:(input?.url||"");
  const method=String(init?.method||"GET").toUpperCase();
  const officerWrite=!!state.officerCsrf && !["GET","HEAD","OPTIONS"].includes(method) && /\/api\/(officer\/|inspections(?:$|\?)|certificates(?:$|\?)|field(?:$|\?)|reinspection(?:$|\?)|document-intelligence(?:$|\?))/.test(url) && !/\/api\/officer\/login(?:$|\?)/.test(url);

  headers.set("X-Vmx-CSRF",state.officerCsrf);
  return rawFetch(input,{...init,headers});
};

 "Maharashtra":["Pune","Mumbai","Nagpur","Nashik","Aurangabad","Thane"],

 }
 if(state.applyStep===2){
  return '<div class="grid g2">'+selectField("category","Instrument category",a.category||"Weighing Instruments",["Weighing Instruments","Measuring Instruments","Fuel / Flow Meter","Length / Area / Volume","Other Regulated Instrument"])+field("instrument_type","Instrument type",a.instrument_type||"Non-automatic weighing instrument")+field("manufacturer","Manufacturer",a.manufacturer)+field("model","Model number",a.model)+field("serial_number","Serial number",(a.serial_number||"").toUpperCase())+field("capacity_range","Capacity / range",a.capacity_range)+field("installation_location","Installation location",a.installation_location)+field("purpose","Purpose / use",a.purpose||"Trade weighing")+'</div>'+stepActions(true,true)
 }

  return '<div class="alert notice"><b>Required documents:</b> GST Certificate, Purchase Invoice and Instrument Photograph. Optional supporting records can be added below. Accepted: PDF, JPG or PNG · maximum 10 MB per file. File checksums are calculated server-side.</div><div class="grid g2" style="margin-top:18px">'+docs.map(x=>'<label><span class="label">'+x[1]+' '+(x[2]?'<span class="status warn" style="font-size:10px;padding:4px 7px">REQUIRED</span>':'<span class="small muted">Optional</span>')+'</span><input class="input doc-input" data-doc-type="'+x[0]+'" type="file" accept=".pdf,.jpg,.jpeg,.png"></label>').join("")+'</div><div id="docState" class="small muted" style="margin-top:12px"></div>'+stepActions(true,true)
 }
 const entries=Object.entries(a).filter(x=>x[0]!=="existing_instrument_id"&&x[0]!=="previous_certificate");

function stepActions(back,next,submit=false){return '<div class="form-actions">'+(back?'<button type="button" class="btn outline" onclick="prevStep()">← Back</button>':'<span></span>')+'<div class="form-actions-right">'+(submit?'<button class="btn primary" type="submit">Submit Application →</button>':next?'<button class="btn primary" type="button" onclick="nextStep()">Continue →</button>':'')+'</div></div>'}
function captureForm(){const f=document.getElementById("applyForm");if(!f)return true;if(!f.checkValidity()){f.reportValidity();return false}const fd=new FormData(f);for(const [k,v] of fd.entries())if(!k.startsWith("doc_"))state.form[k]=v;return true}
function bindApply(){
 const f=document.getElementById("applyForm");if(!f)return;
 f.querySelectorAll('select[name="state"]').forEach(s=>s.addEventListener("change",()=>{state.form.state=s.value;state.form.district=(districts[s.value]||["Other"])[0];renderApplyKeep()}));
 f.querySelectorAll(".doc-input").forEach(inp=>inp.addEventListener("change",()=>{if(inp.files&&inp.files[0])state.docs[inp.dataset.docType]=inp.files[0];else delete state.docs[inp.dataset.docType];renderDocState()}));
 f.onsubmit=e=>{e.preventDefault();if(state.applyStep<4){if(captureForm())nextStep()}else submitApplication()};
 renderDocState()
}
function renderDocState(){const el=document.getElementById("docState");if(el)el.textContent=Object.keys(state.docs).length+" document(s) selected."}
function renderApplyKeep(){const old=state.applyStep;layout(apply());bindApply();state.applyStep=old}
function nextStep(){if(!captureForm())return;if(state.applyStep===3){const required=["gst_certificate","purchase_invoice","instrument_photo"],missing=required.filter(x=>!state.docs[x]);if(missing.length){toast("Add required documents: "+missing.join(", ").replaceAll("_"," "),"danger");return}}state.applyStep=Math.min(4,state.applyStep+1);layout(apply());bindApply()}

async function submitApplication(){
 if(state.submitting)return;
 const msg=document.getElementById("submitMsg"),btn=document.querySelector('#applyForm button[type="submit"]');
 if(msg){msg.hidden=false;msg.className="alert notice";msg.textContent="Submitting application and calculating risk…"}
 state.submitting=true;if(btn)btn.disabled=true;
 try{
  const payload={...state.form,model:state.form.model||state.form.model_number,category:state.form.category||state.form.instrument_category};
  const r=await fetch(API+"/applications",{method:"POST",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify(payload)});
  const j=await r.json();if(!r.ok)throw Error(j.error||"Unable to submit application");
  state.submitted=j;const uploadErrors=[];
  for(const [type,file] of Object.entries(state.docs||{})){
   const fd=new FormData();fd.append("application_number",j.application.application_number);fd.append("email",state.form.email||"");fd.append("document_type",type);fd.append("file",file);
   try{const ur=await fetch(API+"/documents",{method:"POST",body:fd});const uj=await ur.json();if(!ur.ok)uploadErrors.push(type.replaceAll("_"," ")+": "+(uj.error||"upload failed"))}
   catch(_){uploadErrors.push(type.replaceAll("_"," ")+": upload failed; contact the responsible office with your application number")}
  }
  state.submitted.uploadErrors=uploadErrors;renderSubmissionSuccess();
 }catch(e){if(msg){msg.hidden=false;msg.className="alert danger";msg.textContent=e.message||"Submission failed"}}
 finally{state.submitting=false;if(btn&&btn.isConnected)btn.disabled=false}
}

}

 const measurements=(j.measurements||[]).map(m=>`<tr><td>${esc(m.measurement_name)}</td><td>${esc(m.nominal_value)}</td><td>${esc(m.indication)}</td><td>${esc(m.error_value)}</td><td>${esc(m.permissible_error)}</td><td><span class="status ${statusClass(m.result)}">${esc(m.result)}</span></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No measurement evidence recorded yet.</td></tr>';
 const evidence=(j.evidence||[]).map(e=>`<tr><td>${esc(e.evidence_type)}</td><td>${dateFmt(e.captured_at)}</td><td class="mono small">${esc(e.checksum||"—")}</td><td>${e.latitude!=null&&e.longitude!=null?esc(Number(e.latitude).toFixed(5)+", "+Number(e.longitude).toFixed(5)):"—"}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No field evidence recorded yet.</td></tr>';
 return `<div class="card detail-section"><div class="detail-head"><div><div class="small muted">APPLICATION</div><h3 style="margin:6px 0 0;font-size:20px" class="mono">${esc(a.application_number)}</h3><div class="small muted" style="margin-top:5px">${esc(a.applicant_name)} · ${esc(a.organization)}</div></div><div class="detail-actions"><span class="status ${statusClass(a.status)}">${esc(a.status)}</span><button class="btn outline" onclick="officerApplicationsTab()">← Queue</button></div></div><div class="grid g3" style="margin-top:22px"><div><div class="small muted">RISK</div><b>${esc(j.risk?.risk_level||a.risk_level)} · ${esc(j.risk?.risk_score||a.risk_score)}/100</b></div><div><div class="small muted">SERIAL</div><b class="mono">${esc(a.serial_number)}</b></div><div><div class="small muted">INSTRUMENT</div><b>${esc(a.instrument_type)}</b></div><div><div class="small muted">STATE / DISTRICT</div><b>${esc(a.state)} · ${esc(a.district)}</b></div><div><div class="small muted">INSTALLATION</div><b>${esc(a.installation_location)}</b></div><div><div class="small muted">PERMANENT ID</div><b class="mono">${esc(a.instrument_id||"Pending")}</b></div></div></div><div class="grid g2" style="margin-top:18px"><div class="card detail-section"><h3>Workflow decision</h3>${reviewControl}<textarea id="reviewNotes" class="textarea" placeholder="Officer notes" style="margin-top:10px"></textarea></div><div class="card detail-section"><h3>Inspection</h3>${insp&&insp.status?`<div class="small muted">Latest inspection: ${dateFmt(insp.scheduled_date)} ${esc(insp.scheduled_time||"")} · ${esc(insp.status)}</div>`:"<div class=\"small muted\">No inspection scheduled.</div>"}<div class="grid g3" style="margin-top:12px"><input id="insDate" class="input" type="date"><input id="insTime" class="input" type="time"><input id="insLoc" class="input" placeholder="Location" value="${esc(a.installation_location)}"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn secondary" onclick="scheduleInspection('${esc(a.id)}')">Schedule inspection</button>${insp&&String(insp.completion_result||"").toUpperCase()==="FAIL"?'<button class="btn danger" onclick="scheduleReinspection(&quot;${esc(a.id)}&quot;,&quot;${esc(insp.id)}&quot;)">Schedule re-inspection</button>':""}${insp?`<button class="btn outline" onclick="completeInspection('${esc(a.id)}','${esc(insp.id)}')">Complete inspection</button>`:""}</div></div></div><div class="card detail-section" style="margin-top:18px"><h3>Inspection measurement evidence</h3><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Point</th><th>Nominal</th><th>Indication</th><th>Error</th><th>Perm. error</th><th>Result</th></tr></thead><tbody>${measurements}</tbody></table></div><h3 style="margin-top:18px">Field evidence</h3><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Type</th><th>Captured</th><th>Checksum</th><th>Coordinates</th></tr></thead><tbody>${evidence}</tbody></table></div></div><div class="grid g2" style="margin-top:18px"><div class="card detail-section"><h3>Documents</h3><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Type</th><th>File</th><th>Status</th></tr></thead><tbody>${docs}</tbody></table></div></div><div class="card detail-section"><h3>Certificate actions</h3><p class="small muted">Certificate issuance requires a PASS inspection. Certificate revocation is reserved for regulator administrator access and is not available to LMO officers.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="issueCertificate('${esc(a.id)}')">Issue Certificate</button><span class="small muted">Revocation requires regulator administrator access.</span></div>${certs}</div></div><div class="card detail-section" style="margin-top:18px"><h3>Risk assessment</h3><div class="small muted" style="margin-top:5px">Deterministic result: <b>${esc(j.risk?.risk_level||a.risk_level)} · ${esc(j.risk?.risk_score||a.risk_score)}/100</b></div><div class="grid g2" style="margin-top:12px">${ruleResults}</div></div><div class="card detail-section" style="margin-top:18px"><h3>Audit & workflow history</h3><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Time</th><th>Type</th><th>Actor</th><th>Notes</th></tr></thead><tbody>${events}</tbody></table></div></div>`;
}
async function saveOfficerReview(id){try{const status=document.getElementById("reviewStatus").value,notes=document.getElementById("reviewNotes").value;const r=await fetch(API+"/officer/review",{method:"POST",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({id,status,notes})});const j=await r.json();if(!r.ok)throw Error(j.error||"Could not update status");toast("Application status updated","success");await officerDetail(id);state.officer.dashboard.applications=state.officer.dashboard.applications.map(x=>x.id===id?{...x,status}:x)}catch(e){toast(e.message,"danger")}}
async function scheduleInspection(id){try{const scheduled_date=document.getElementById("insDate").value,scheduled_time=document.getElementById("insTime").value,location=document.getElementById("insLoc").value.trim();if(!scheduled_date||!scheduled_time||!location)throw Error("Date, time and location are required");const r=await fetch(API+"/inspections",{method:"POST",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({application_id:id,scheduled_date,scheduled_time,location,officer_name:"Verification Officer"})});const j=await r.json();if(!r.ok)throw Error(j.error||"Could not schedule inspection");toast("Inspection scheduled","success");await officerDetail(id)}catch(e){toast(e.message,"danger")}}
async function completeInspection(appId,inspId){const result=prompt("Inspection result: PASS, FAIL or PENDING","PASS")?.toUpperCase();if(!result||!["PASS","FAIL","PENDING"].includes(result))return;const remarks=prompt("Inspection remarks:")||"";let measurements=[];if(result!=="PENDING"){const nominal=Number(prompt("Nominal value:","100")),indication=Number(prompt("Indication:",result==="PASS"?"100":"101.5")),permissible=Number(prompt("Permissible error:","1"));if(![nominal,indication,permissible].every(Number.isFinite)||permissible<0){toast("Valid measurement values are required","danger");return}measurements=[{measurement_name:"field measurement",nominal_value:nominal,indication,permissible_error:permissible}]}const checklist=[{item:"Instrument identity and serial verified",result:"PASS"},{item:"Physical condition acceptable",result:"PASS"},{item:"Accuracy / performance checked",result:result==="PASS"?"PASS":"PENDING"},{item:"Seals / verification marks checked",result:result==="PASS"?"PASS":"PENDING"}];try{const r=await fetch(API+"/inspections",{method:"PUT",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({application_id:appId,inspection_id:inspId,completion_result:result,measurements,checklist,remarks})});const j=await r.json();if(!r.ok)throw Error(j.error||"Could not complete inspection");toast("Inspection updated","success");await officerDetail(appId)}catch(e){toast(e.message,"danger")}}
async function scheduleReinspection(appId,parentInspectionId){const scheduled_date=prompt("Re-inspection date (YYYY-MM-DD):")||"";const scheduled_time=prompt("Re-inspection time (HH:MM):")||"";if(!scheduled_date||!scheduled_time)return;const location=document.getElementById("insLoc")?.value.trim()||"";try{const r=await fetch(API+"/reinspection",{method:"POST",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({application_id:appId,parent_inspection_id:parentInspectionId,scheduled_date,scheduled_time,location,officer_name:"Verification Officer"})});const j=await r.json();if(!r.ok)throw Error(j.error||"Could not schedule re-inspection");toast("Re-inspection scheduled","success");await officerDetail(appId)}catch(e){toast(e.message||"Re-inspection failed","danger")}}
async function issueCertificate(id){if(!confirm("Issue a certificate for this application? A PASS inspection is required."))return;try{const r=await fetch(API+"/certificates",{method:"POST",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({application_id:id})});const j=await r.json();if(!r.ok)throw Error(j.error||"Certificate issuance failed");toast("Certificate issued: "+j.certificate.certificate_id,"success");await officerDetail(id)}catch(e){toast(e.message,"danger")}}
async function revokeCertificate(id){const reason=prompt("Reason for certificate revocation:");if(!reason)return;try{const r=await fetch(API+"/certificates",{method:"POST",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({application_id:id,action:"revoke",reason})});const j=await r.json();if(!r.ok)throw Error(j.error||"Revocation failed");toast("Certificate revoked","success");await officerDetail(id)}catch(e){toast(e.message,"danger")}}
async function analyzeDocument(applicationId,documentId){
 const box=document.getElementById("ai-doc-"+documentId);
 if(box)box.innerHTML='<span class="muted">Analyzing document…</span>';
 try{
  const r=await fetch(API+"/document-intelligence",{method:"POST",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({application_id:applicationId,document_id:documentId})});
  const j=await r.json();if(!r.ok)throw Error(j.error||"Document intelligence failed");
  const x=j.review||{},flags=Array.isArray(x.discrepancy_flags)?x.discrepancy_flags:[],matches=Array.isArray(x.match_results)?x.match_results:[];
  if(box)box.innerHTML='<span class="status '+(flags.length?"danger":"success")+'">'+(flags.length?flags.length+" discrepancy flag(s)":"No discrepancy flags")+'</span><span class="small muted" style="margin-left:7px">Risk contribution: +'+esc(x.risk_delta||0)+'</span><div class="small muted" style="margin-top:4px">'+esc(x.explanation||"Review complete.")+'</div>';
  toast(j.ai_configured?"AI document review completed":"Deterministic document review completed","success");
 }catch(e){if(box)box.innerHTML='<span class="small" style="color:#b33333">'+esc(e.message||"Review failed")+'</span>';toast(e.message||"Document intelligence failed","danger")}
}
async function verifyDocument(id,status){
 const rejection_reason=status==="REJECTED"?(prompt("Enter the rejection reason:")||""):"";
 if(status==="REJECTED"&&!rejection_reason){toast("Rejection reason is required","danger");return}
 try{
  const r=await fetch(API+"/officer/documents",{method:"PUT",headers:{"content-type":"application/json","X-Vmx-CSRF":state?.officerCsrf||""},body:JSON.stringify({id,status,rejection_reason})});
  const j=await r.json();if(!r.ok)throw Error(j.error||"Document review failed");
  toast(status==="VERIFIED"?"Document approved":"Document rejected",status==="VERIFIED"?"success":"danger");
  await officerDetail(state.officerApp.application.id);
 }catch(e){toast(e.message||"Document review failed","danger")}
}
function parsePath(){const parts=location.pathname.split("/").filter(Boolean);if(parts[0]==="scan")return["scan",parts[1]?decodeURIComponent(parts.slice(1).join("/")):""];if(parts[0]==="how"||parts[0]==="how-it-works")return["how"];if(parts[0]==="apply")return["apply"];if(parts[0]==="stakeholder")return["stakeholder"];if(parts[0]==="track")return["track"];if(parts[0]==="verify")return["verify"];if(parts[0]==="instrument-passport")return["passport"];if(parts[0]==="renew")return["renew"];if(parts[0]==="report")return["report"];if(parts[0]==="officer-login")return["officer-login"];if(parts[0]==="officer-admin")return["officer-admin"];if(parts[0]==="officer"||parts[0]==="officer-dashboard")return["officer"];return["home"]}
window.addEventListener("popstate",()=>{const [p,param]=parsePath();state.page=p;if(p==="home")layout(home());else if(p==="how")layout(how());else if(p==="apply"){layout(apply());bindApply()}else if(p==="stakeholder"){stakeholderPortal()}else if(p==="track")showTrackPage();else if(p==="verify"){layout(verify());const q=new URLSearchParams(location.search).get("certificate");if(q)setTimeout(()=>{document.getElementById("verifyQ").value=q;loadVerify()},20)}else if(p==="renew"){layout(renew());const q=new URLSearchParams(location.search).get("instrument");if(q)setTimeout(()=>{document.getElementById("renewQ").value=q;loadRenew()},20)}else if(p==="passport"){layout(passport());const q=new URLSearchParams(location.search).get("instrument");if(q)setTimeout(()=>{document.getElementById("passportQ").value=q;loadPassport()},20)}else if(p==="scan"){layout(scan());if(param)setTimeout(()=>{document.getElementById("scanQ").value=param;resolveScan(param)},20)}else if(p==="report")layout(report());else if(p==="officer-login"){document.body.classList.remove("public-mode");document.getElementById("app").innerHTML=officerLoginPage();bindOfficerLogin()}else if(p==="officer-admin"){document.body.classList.remove("public-mode");document.getElementById("app").innerHTML=officerAdminPage();loadOfficerAdmin()}else if(p==="officer")renderOfficer()});
(function boot(){const [p,param]=parsePath();state.page=p;if(p==="home")layout(home());else if(p==="how")layout(how());else if(p==="apply"){layout(apply());bindApply()}else if(p==="stakeholder"){stakeholderPortal()}else if(p==="track")showTrackPage();else if(p==="verify"){layout(verify());const q=new URLSearchParams(location.search).get("certificate");if(q)setTimeout(()=>{document.getElementById("verifyQ").value=q;loadVerify()},20)}else if(p==="renew"){layout(renew());const q=new URLSearchParams(location.search).get("instrument");if(q)setTimeout(()=>{document.getElementById("renewQ").value=q;loadRenew()},20)}else if(p==="passport"){layout(passport());const q=new URLSearchParams(location.search).get("instrument");if(q)setTimeout(()=>{document.getElementById("passportQ").value=q;loadPassport()},20)}else if(p==="scan"){layout(scan());if(param)setTimeout(()=>{document.getElementById("scanQ").value=param;resolveScan(param)},20)}else if(p==="report")layout(report());else if(p==="officer-login"){document.body.classList.remove("public-mode");document.getElementById("app").innerHTML=officerLoginPage();bindOfficerLogin()}else if(p==="officer-admin"){document.body.classList.remove("public-mode");document.getElementById("app").innerHTML=officerAdminPage();loadOfficerAdmin()}else if(p==="officer")renderOfficer()})();
</script>
